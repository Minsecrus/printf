<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <meta name="description" content="拆解 C printf 的标志、宽度、精度、长度和转换说明符，输入格式串与参数，实时探索格式化输出。">
  <title>printf. — 格式，一眼看懂</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231b1b1b'/%3E%3Ctext x='16' y='23' text-anchor='middle' font-family='monospace' font-size='24' fill='%23fafafa'%3E%25%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="wordmark" href="./" aria-label="printf 首页">printf<span>.</span></a>
    </header>
    <main>
      <section class="anatomy" aria-label="printf 格式语法">
        <div class="inspector" id="inspector" style="--segment-color: var(--flags)">
          <div class="inspector-heading"><h2 id="segment-title">标志</h2></div>
          <div class="choices" id="choices"></div>
        </div>
        <div class="syntax" aria-label="百分号、可选标志 FF、可选宽度 WW、可选精度 PP、可选长度 LL、转换说明符 SS">
          <div class="syntax-prefix"><span class="syntax-code">%</span><span class="token-caption">起始符</span></div>
          <button class="token is-active" data-segment="flags" aria-pressed="true" aria-controls="inspector" aria-label="FF 标志，可替换内容"><span class="syntax-code"><span class="bracket">[</span>FF<span class="bracket">]</span></span><span class="token-caption">标志</span></button>
          <button class="token" data-segment="width" aria-pressed="false" aria-controls="inspector" aria-label="WW 宽度，可替换内容"><span class="syntax-code"><span class="bracket">[</span>WW<span class="bracket">]</span></span><span class="token-caption">宽度</span></button>
          <button class="token" data-segment="precision" aria-pressed="false" aria-controls="inspector" aria-label="PP 精度，可替换内容"><span class="syntax-code"><span class="bracket">[</span>.PP<span class="bracket">]</span></span><span class="token-caption">精度</span></button>
          <button class="token" data-segment="length" aria-pressed="false" aria-controls="inspector" aria-label="LL 修饰符，可替换内容"><span class="syntax-code"><span class="bracket">[</span>LL<span class="bracket">]</span></span><span class="token-caption">修饰符</span></button>
          <button class="token" data-segment="specifier" aria-pressed="false" aria-controls="inspector" aria-label="SS 说明符，可替换内容"><span class="syntax-code">SS</span><span class="token-caption">说明符</span></button>
        </div>
        <div class="syntax-note"><span><code>[ ]</code> 表示可省略</span></div>
      </section>
      <section class="playground" aria-label="格式化输出">
        <form id="printf-form" autocomplete="off">
          <div class="inputs">
            <div class="field format-field"><label for="format-input">格式化串</label><div class="input-shell"><span class="input-quote" aria-hidden="true">“</span><div class="format-editor"><div class="input-highlight" aria-hidden="true"><span id="format-highlight"></span></div><input id="format-input" value="%+08.2f" placeholder="%d, %s" spellcheck="false"></div><span class="input-quote" aria-hidden="true">”</span></div></div>
            <div class="field"><label for="args-input">参数</label><div class="input-shell"><input id="args-input" value="3.14159" placeholder="42, &quot;hello&quot;" title="多个参数用逗号分隔，字符串加双引号" spellcheck="false"></div></div>
          </div>
        </form>
        <div class="output-panel" id="output-panel"><div class="output-bar"><span>输出</span><span id="output-meta">8 字节</span></div><pre id="output" aria-live="polite" aria-atomic="true">+0003.14</pre><p class="output-error" id="output-error" role="status" hidden></p></div>
      </section>
    </main>
    <footer><details><summary>支持范围</summary><p>浏览器计算：UTF-8、LP64、double，支持 C23 的 b / B 与 wN。p、n、宽字符、long double、wfN 仅提供说明。精度按字节截断，非完整 UTF-8 显示为 �。</p></details></footer>
  </div>
</body>
</html>
